changelog:
  exclude:
    # labels:
    #   - chore
    #   - ci
    authors:
      - github-actions[bot]
  categories:
    - title: "🚀 Features"
      labels:
        - feat
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📖 Documentation"
      labels:
        - docs
    - title: "🧰 Maintenance"
      labels:
        - chore
        - ci
        - perf
